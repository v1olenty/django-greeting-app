{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приветствие</title>
    <link rel="stylesheet" href="{% static 'greeter/style.css' %}">
</head>
<body>
    <div class="card">
        {% if name and not error %}
            <h1>Привет, {{ name }}!</h1>
        {% else %}
            <h1>Как вас зовут?</h1>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input
                type="text"
                name="name"
                placeholder="Введите имя"
                maxlength="100"
            >
            <button type="submit">Submit</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
